server.port=22200
spring.application.name=mall-cart

spring.cloud.nacos.discovery.server-addr=${NACOS_ADDR:127.0.0.1:8848}

spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
# spring.thymeleaf.enabled=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.session.store-type=redis
server.servlet.session.timeout=30m
spring.session.redis.namespace=spring:session

management.endpoints.web.exposure.include=*

spring.cloud.sentinel.transport.client-ip=localhost
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:localhost:8080}
spring.cloud.sentinel.transport.port=8719